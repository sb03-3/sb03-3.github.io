<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shivank Bhatia</title>
  <meta name="description" content="Shivank Bhatia">
  <meta property="og:title" content="Shivank Bhatia">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbfaf7;
      --ink: #1a1917;
      --soft: #55524c;
      --faint: #a8a39a;
      --rule: #e7e3db;
      --accent: #8a5a3b;
      --serif: "Newsreader", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --gutter: 20px;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161513;
        --ink: #ece9e3;
        --soft: #b0aba1;
        --faint: #6b665d;
        --rule: #2a2825;
        --accent: #c99f78;
      }
    }

    *, ::before, ::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap {
      min-height: 100vh;
      min-height: 100svh;
      padding: 6vh var(--gutter);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 9vw, 5.2rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    /* Easter egg: asleep in a goal-net hammock, ball for a pillow. Click to (briefly) wake him. */
    .sleeper {
      position: relative;
      width: min(340px, 82vw);
      margin-top: 3rem;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.35s;
      animation: fadein 1.4s ease-out 0.4s backwards;
    }
    .sleeper:hover, .sleeper:focus-visible, .sleeper.awake { opacity: 1; }
    .sleeper:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 6px; }
    .sleeper svg { display: block; width: 100%; height: auto; overflow: visible; }

    .s { fill: none; stroke: var(--faint); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.35s; }
    .t { fill: none; stroke: var(--faint); stroke-width: 0.9px; stroke-linecap: round; transition: stroke 0.35s; }
    .net { fill: none; stroke: var(--faint); stroke-width: 0.6px; opacity: 0.25; }
    .j { fill: var(--bg); stroke: var(--faint); stroke-width: 1.1px; transition: stroke 0.35s; }
    .f { fill: var(--faint); transition: fill 0.35s; }
    .egg:hover .s, .egg.awake .s, .egg.kicking .s { stroke: var(--ink); }
    .egg:hover .t, .egg:hover .j, .egg.awake .t, .egg.awake .j, .egg.kicking .t, .egg.kicking .j { stroke: var(--soft); }
    .egg:hover .f, .egg.awake .f, .egg.kicking .f { fill: var(--ink); }

    /* Easter egg #2: a robot leg in the corner. Click to kick. */
    .kicker {
      position: fixed;
      right: 1.6rem;
      bottom: 1.6rem;
      z-index: 5;
      width: 84px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.35s;
      animation: fadein-corner 1.1s ease-out 0.8s backwards;
    }
    .kicker:hover, .kicker:focus-visible, .kicker.kicking { opacity: 1; }
    .kicker:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    /* mirrored so the leg sits on the right and kicks the ball in toward the page */
    .kicker svg { display: block; width: 100%; height: auto; overflow: visible; transform: scaleX(-1); }
    .thigh { transform-box: view-box; transform-origin: 22px 12px; }
    .shin { transform-box: view-box; transform-origin: 25px 33px; }
    .kball { transform-box: fill-box; transform-origin: 50% 50%; }
    .kicking .thigh { animation: thigh 1.1s cubic-bezier(.4, 0, .2, 1); }
    .kicking .shin { animation: shin 1.1s cubic-bezier(.4, 0, .2, 1); }
    .kicking .kball { animation: fly 1.6s cubic-bezier(.2, .6, .4, 1); }

    /* gentle hammock sway + breathing */
    .sway { transform-box: view-box; transform-origin: 80px 34px; animation: sway 6s ease-in-out infinite; }
    .blanket { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 4.2s ease-in-out infinite; }

    /* drifting z's */
    .z { font-family: var(--mono); fill: var(--faint); opacity: 0; transition: fill 0.35s; }
    .sleeper:hover .z { fill: var(--accent); }
    .z1 { font-size: 6px; animation: drift 4.2s ease-in-out infinite; }
    .z2 { font-size: 8px; animation: drift 4.2s ease-in-out 1.4s infinite; }
    .z3 { font-size: 10px; animation: drift 4.2s ease-in-out 2.8s infinite; }

    /* awake state */
    .open { opacity: 0; }
    .awake .open { opacity: 1; }
    .awake .shut { opacity: 0; }
    .awake .z { animation: none; opacity: 0; }
    .awake .blanket, .awake .sway { animation: none; }
    .head { transform-box: fill-box; transform-origin: 50% 100%; }
    .awake .head { animation: startle 0.4s ease-out; }

    .bubble {
      position: absolute;
      left: 50%;
      bottom: 100%;
      margin-bottom: 0.4rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
      color: var(--accent);
      opacity: 0;
      transform: translate(-50%, 4px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }
    .awake .bubble { opacity: 1; transform: translate(-50%, 0); }

    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.2deg); }
    }
    @keyframes breathe {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.07); }
    }
    @keyframes drift {
      0% { opacity: 0; transform: translate(0, 0); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(6px, -12px); }
    }
    @keyframes startle {
      0% { transform: translateY(0); }
      40% { transform: translateY(-3px); }
      100% { transform: translateY(0); }
    }
    /* kick: wind up (knee bends back), swing through, follow through, settle */
    @keyframes thigh {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(24deg); }
      48% { transform: rotate(-26deg); }
      62% { transform: rotate(-34deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes shin {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(50deg); }
      48% { transform: rotate(-4deg); }
      62% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes fly {
      0%, 30% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      55% { transform: translate(40px, -26px) rotate(260deg); opacity: 1; }
      68% { transform: translate(64px, -30px) rotate(400deg); opacity: 0; }
      69% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 0.6; } }
    @keyframes fadein-corner { from { opacity: 0; } to { opacity: 0.45; } }

    @media (prefers-reduced-motion: reduce) {
      .sleeper, .kicker, .sway, .blanket, .awake .head { animation: none; }
      .z { animation: none; opacity: 1; }
    }

    @media (max-width: 480px) {
      body { font-size: 15px; }
      .sleeper { margin-top: 2.2rem; }
      .kicker { width: 64px; right: 1.1rem; bottom: 1.1rem; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Shivank Bhatia</h1>

    <button class="egg sleeper" type="button" aria-label="Someone is asleep in the goal. Click to wake them up.">
      <span class="bubble" aria-live="polite"></span>
      <svg viewBox="0 0 160 90" aria-hidden="true">
        <!-- back of the goal net -->
        <path class="net" d="M40 8 V82 M60 8 V82 M80 8 V82 M100 8 V82 M120 8 V82 M20 26 H140 M20 44 H140 M20 63 H140" />
        <!-- goal frame + ground -->
        <path class="s" d="M20 82 V8 H140 V82" />
        <path class="t" d="M6 82 H154" />

        <g class="sway">
          <!-- hammock ropes to the posts -->
          <path class="t" d="M20 34 L26 44 M140 34 L134 44" />
          <!-- hammock (net mesh) -->
          <path class="s" d="M26 44 Q80 66 134 44" />
          <path class="s" d="M26 44 Q80 82 134 44" />
          <path class="t" d="M44 50.5 L62 60.5 M62 54 L80 63 M80 55 L98 60.5 M98 54 L116 55.5 M44 55.5 L62 54 M62 60.5 L80 55 M80 63 L98 54 M98 60.5 L116 50.5" />

          <!-- pillow -->
          <rect class="j" x="33" y="42" width="15" height="7" rx="3.5" transform="rotate(-12 40.5 45.5)" />

          <!-- head -->
          <g class="head">
            <circle class="j" cx="50.5" cy="42" r="6" />
            <path class="t shut" d="M47 42.4 Q48.4 43.7 49.8 42.4" />
            <circle class="f open" cx="48.4" cy="42" r="0.9" />
          </g>

          <!-- blanket (breathes) -->
          <path class="s blanket" d="M56 50 Q60 40 76 41 Q100 41 116 49" />
          <path class="t" d="M60 46 Q63 43 67 43" />
        </g>

        <!-- z's -->
        <text class="z z1" x="56" y="34">z</text>
        <text class="z z2" x="61" y="29">z</text>
        <text class="z z3" x="67" y="23">z</text>
      </svg>
    </button>
  </main>

  <button class="egg kicker" type="button" aria-label="A robot leg next to a soccer ball. Click to kick.">
    <svg viewBox="0 0 70 66" aria-hidden="true">
      <!-- ground -->
      <path class="t" d="M2 62.5 H68" />
      <!-- ball -->
      <g class="kball">
        <circle class="j" cx="49" cy="55" r="7" />
        <path class="f" d="M49 52.4 L51.5 54.2 L50.5 57.1 L47.5 57.1 L46.5 54.2 Z" />
        <path class="t" d="M49 52.4 V48 M51.5 54.2 L55.7 52.8 M50.5 57.1 L53.1 60.7 M47.5 57.1 L44.9 60.7 M46.5 54.2 L42.3 52.8" />
      </g>
      <!-- mount -->
      <path class="s" d="M12 3 H32" />
      <rect class="j" x="17" y="3" width="10" height="5" rx="1" />
      <!-- leg -->
      <g class="thigh">
        <path class="s" d="M19 12 L22 33 M25 12 L28 33" />
        <g class="shin">
          <path class="s" d="M22 34 L19 53 M28 34 L25 53" />
          <path class="s" d="M14 60 V58 Q14 55.5 17.5 55.5 L30 56.5 Q35 57.5 34.5 60 Z" />
          <circle class="j" cx="22" cy="54" r="2.6" />
        </g>
        <circle class="j" cx="25" cy="33" r="4" />
        <circle class="f" cx="25" cy="33" r="1" />
      </g>
      <circle class="j" cx="22" cy="12" r="4" />
      <circle class="f" cx="22" cy="12" r="1" />
    </svg>
  </button>

  <script>
    (() => {
      const btn = document.querySelector(".sleeper");
      const bubble = btn.querySelector(".bubble");
      const lines = [
        "5 more minutes, ref…",
        "wake me up at kickoff",
        "*hits snooze*",
        "extra time = extra sleep",
        "offside. go back to bed.",
        "zzz",
      ];
      let i = 0, timer;
      btn.addEventListener("click", () => {
        bubble.textContent = lines[i++ % lines.length];
        btn.classList.remove("awake");
        void btn.offsetWidth; // restart the wake animations on repeat clicks
        btn.classList.add("awake");
        clearTimeout(timer);
        timer = setTimeout(() => btn.classList.remove("awake"), 2000);
      });

      const kicker = document.querySelector(".kicker");
      let kickTimer;
      kicker.addEventListener("click", () => {
        kicker.classList.remove("kicking");
        void kicker.offsetWidth; // restart the kick on repeat clicks
        kicker.classList.add("kicking");
        clearTimeout(kickTimer);
        kickTimer = setTimeout(() => kicker.classList.remove("kicking"), 1600);
      });
    })();
  </script>
</body>
</html>
